name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push makes an in-flight run for the same ref pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend - ruff, pytest, live smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Pytest
        run: pytest -q

      # The smoke script drives a live server, so it needs real demo data and a
      # running API. These are the checks that catch what unit tests cannot -
      # Set-Cookie headers, cookie paths, and status codes over real HTTP.
      - name: Seed demo data
        run: python -m app.seed

      - name: Live smoke test
        run: |
          set -euo pipefail
          uvicorn app.main:app --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null || {
            echo "::error::the API never became healthy"
            exit 1
          }
          ./scripts/smoke.sh

  frontend:
    name: frontend - typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # ci, not install: it fails loudly if package-lock.json has drifted from
      # package.json, rather than quietly resolving something different.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build